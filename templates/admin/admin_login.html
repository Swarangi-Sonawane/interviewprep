<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - PrepMate</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/admin/admin_login.css') }}">
    <link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
</head>
<body>
    <script 
        src="https://cdn.jsdelivr.net/npm/toastify-js">
    </script>
    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <script>
                Toastify({text: "{{ messages[0] }}", duration: 3000, gravity: "top", position: "right"}).showToast();
            </script>
        {% endif %}
    {% endwith %}
    <div class="login-container">
        <div class="login-card">
            <h1>PrepMate</h1>
            <p class="subtitle">Admin Login</p>
            <form method="POST">
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Enter admin email" required>
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter password" required>
                </div>
                <button type="submit">Login</button>
            </form>
        </div>
    </div>
</body>
</html>
