<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - PrepMate</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/register.css') }}">
    <link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
</head>
<body>
    <script 
        src="https://cdn.jsdelivr.net/npm/toastify-js">
    </script>
    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <script>
                Toastify({text: "{{ messages[0] }}", duration: 3000, gravity: "top", position: "right"}).showToast();
            </script>
        {% endif %}
    {% endwith %}
    <div class="register-container">
        <h1>Create Account</h1>
        <p>Register to start your preparation.</p>
        <form method="POST">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" placeholder="Enter your full name">

            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Enter your email">

            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Create a password">

            <label for="confirm-password">Confirm Password</label>
            <input type="password" id="confirm-password" name="confirm_password" placeholder="Confirm your password">

            <button type="submit">Register</button>

        </form>
        <p>
            Already have an account?
            <a href="{{ url_for('login.login_page') }}">Login</a>
        </p>
    </div>
    
</body>
</html>
